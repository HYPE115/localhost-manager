<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localhost Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.8/dist/clipboard.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Localhost Manager</h1>
            <p class="text-gray-600">Partagez vos services locaux avec votre équipe</p>
        </header>

        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Créer un nouveau tunnel</h2>
            <form id="tunnelForm" class="space-y-4">
                <div>
                    <label for="port" class="block text-sm font-medium text-gray-700">Port local</label>
                    <input type="number" id="port" name="port" required 
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="protocol" class="block text-sm font-medium text-gray-700">Protocole</label>
                    <select id="protocol" name="protocol" 
                            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                        <option value="http">HTTP</option>
                        <option value="tcp">TCP</option>
                        <option value="tls">TLS</option>
                    </select>
                </div>
                <button type="submit" 
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Créer le tunnel
                </button>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Tunnels actifs</h2>
            <div id="tunnelsList" class="space-y-4">
                <p id="noTunnels" class="text-gray-500 text-center py-4">Aucun tunnel actif</p>
                <!-- Les tunnels seront ajoutés ici dynamiquement -->
            </div>
        </div>
    </div>

    <script>
        // Connexion au serveur Socket.IO
        const socket = io();
        
        // Initialisation du presse-papier
        new ClipboardJS('.copy-btn');
        
        // Gestion de la soumission du formulaire
        document.getElementById('tunnelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const port = document.getElementById('port').value;
            const protocol = document.getElementById('protocol').value;
            
            try {
                const response = await fetch('/api/tunnels', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ port, protocol })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erreur lors de la création du tunnel');
                }
                
                // Réinitialiser le formulaire
                document.getElementById('port').value = '';
            } catch (error) {
                alert(error.message);
            }
        });
        
        // Mise à jour de la liste des tunnels
        function updateTunnelsList(tunnels) {
            const tunnelsList = document.getElementById('tunnelsList');
            const noTunnels = document.getElementById('noTunnels');
            
            if (Object.keys(tunnels).length === 0) {
                noTunnels.style.display = 'block';
                tunnelsList.innerHTML = '';
                tunnelsList.appendChild(noTunnels);
                return;
            }
            
            noTunnels.style.display = 'none';
            tunnelsList.innerHTML = '';
            
            Object.values(tunnels).forEach(tunnel => {
                const tunnelElement = document.createElement('div');
                tunnelElement.className = 'border rounded-lg p-4 bg-gray-50';
                tunnelElement.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-medium">Port local: ${tunnel.local_port} (${tunnel.protocol.toUpperCase()})</h3>
                            <div class="mt-1 flex items-center">
                                <a href="${tunnel.public_url}" target="_blank" class="text-blue-600 hover:underline break-all">
                                    ${tunnel.public_url}
                                </a>
                                <button class="copy-btn ml-2 text-gray-500 hover:text-gray-700" 
                                        data-clipboard-text="${tunnel.public_url}"
                                        title="Copier le lien">
                                    📋
                                </button>
                            </div>
                        </div>
                        <button onclick="deleteTunnel('${tunnel.public_url}')" 
                                class="text-red-600 hover:text-red-800"
                                title="Supprimer le tunnel">
                            🗑️
                        </button>
                    </div>
                `;
                tunnelsList.appendChild(tunnelElement);
            });
        }
        
        // Supprimer un tunnel
        window.deleteTunnel = async (publicUrl) => {
            if (!confirm('Voulez-vous vraiment supprimer ce tunnel ?')) return;
            
            try {
                const response = await fetch(`/api/tunnels/${encodeURIComponent(publicUrl)}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erreur lors de la suppression du tunnel');
                }
            } catch (error) {
                alert(error.message);
            }
        };
        
        // Écouter les mises à jour en temps réel
        socket.on('tunnel_update', (data) => {
            fetchTunnels();
        });
        
        // Charger les tunnels existants
        async function fetchTunnels() {
            try {
                const response = await fetch('/api/tunnels');
                const tunnels = await response.json();
                updateTunnelsList(tunnels);
            } catch (error) {
                console.error('Erreur lors du chargement des tunnels:', error);
            }
        }
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            fetchTunnels();
            
            // Afficher une notification lors de la copie
            document.addEventListener('copy', (e) => {
                const notice = document.createElement('div');
                notice.textContent = 'Lien copié !';
                notice.className = 'fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 rounded-md shadow-lg';
                document.body.appendChild(notice);
                setTimeout(() => notice.remove(), 2000);
            });
        });
    </script>
</body>
</html>
